#:schema ../../../schema/config.schema.json

# Minimal configuration for package tests: the gateway writes to the ClickHouse
# service, while its only machine is unreachable.

application_uri = "urn:opcua-line-gateway:package-tests"

# Relative paths resolve against the state directory.
pki_dir = "pki"

[traceability]
line_id = "01"
redb_file = "cache.redb"
queues_not_draining_threshold = 10

# BrowseNames are irrelevant, as no machine is reachable.
[traceability.opc_ua]
namespace_url = "urn:opcua-line-gateway:package-tests:common"
mailbox_type = "MailboxType"
operation_part_sheet_type = "OperationPartSheetType"
heartbeat_node = "Heartbeat"
request_node = "Request"
response_node = "Response"
general_part_sheet_node = "GeneralPartSheet"
part_id_node = "PartId"
raw_part_ref_node = "RawPartRef"
raw_batch_node = "RawBatch"
excluded_read_nodes = []

[traceability.database]
url = "http://clickhouse:8123"
default_database = "traceability"
# Short, as tests wait for the first successful run.
part_sheets_drain_period = "1s"
general_part_sheet_table = "part_sheet_general"
operation_part_sheet_table = "part_sheet_operation"

# At least one machine is required. Its server is unreachable, the gateway
# trying to reconnect forever.
[machines.unreachable.opc_ua_server]
url = "opc.tcp://unreachable.invalid:4840"
security_policy = "None"
security_mode = "None"
publish_interval = "1s"

[machines.unreachable.traceability]
namespace_url = "urn:opcua-line-gateway:package-tests:machine"
machine_nid = 1
