[tools]  # tombi: format.rules.table-keys-order = "ascending"
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
"aqua:quarylabs/sqruff" = "latest"
"aqua:taiki-e/cargo-llvm-cov" = "latest"
betterleaks = "latest"
cocogitto = "latest"
editorconfig-checker = "latest"
"github:ClickHouse/clickhousectl" = "latest"
"github:JFRyy/systemd-lsp" = "latest"
"github:docker/docker-language-server" = "latest"
"github:mhersson/mpls" = "latest"
hadolint = "latest"
hk = "latest"
jactionlint = "latest"
marksman = "latest"
node = "lts"
"npm:bash-language-server" = "latest"
"npm:yaml-language-server" = "latest"
pkl = "latest"
"pypi:jsonschema-markdown" = "latest"
python = "3.14"
rumdl = "latest"
rust = { version = "1.99.1", components = "rust-analyzer", profile = "default" }
shellcheck = "latest"
shfmt = "latest"
tombi = "latest"
typos = "latest"
usage = "latest"
uv = "latest"

[env]
# renovate: datasource=github-releases depName=ClickHouse/ClickHouse
CLICKHOUSE_VERSION = "26.10"

[shell_alias]
chctl = "clickhousectl"
# podman compose for package tests
pcpt = 'podman compose --project-directory {{ [config_root, "tests/package"] | join_path | quote }}'

[tasks.build-test-deb]
description = "Build Debian package for tests"
run = """
cargo deb \
  --profile deb-test \
  --no-separate-debug-symbols \
  --fast \
  --verbose \
  --output target/debian-tests/testpkg.deb
"""

[tasks.build-test-deb.tools]
"cargo:cargo-deb" = "latest"

[tasks.start-test-db]
description = "Start the database for integration tests"
run = "clickhousectl local server start integration-tests --version \"$CLICKHOUSE_VERSION\""

[tasks."test:nextest-ci"]
description = "Run tests with cargo-nextest and generate code coverage"
depends = ["start-test-db"]
run = "cargo llvm-cov nextest --profile ci --run-ignored all --workspace --lcov --output-path lcov.info"

# llvm-cov doesn't run doc tests, so run them separately
[tasks."test:doc"]
description = "Run documentation tests"
run = "cargo test --workspace --doc"

[tasks.lint]
description = "Run hk lints"
run = "hk check --all"

[tasks.ci]
description = "Run CI related tasks"
depends = ["lint", "test:*"]
run = "echo 'CI completed successfully'"
