[tools] # tombi: format.rules.table-keys-order = "ascending"
actionlint = "latest"
betterleaks = "latest"
editorconfig-checker = "latest"
ghalint = "latest"
"github:ClickHouse/clickhousectl" = "latest"
"github:mhersson/mpls" = "latest"
hk = "latest"
marksman = "latest"
node = "lts"
"npm:yaml-language-server" = "latest"
pinact = "latest"
pkl = "latest"
rumdl = "latest"
rust = { version = "1.98.0", components = "rust-analyzer", profile = "default" }
shellcheck = "latest"
tombi = "latest"
typos = "latest"
usage = "latest"
zizmor = "latest"

[tools."cargo:https://github.com/ClickHouse/clickhouse-analyzer"]
version = "latest"
crate = "clickhouse-analyzer"
bin = "clickhouse-lsp"
features = "lsp"

[settings]
minimum_release_age = "7d"

[hooks]
enter = "mise outdated --local --silent"

[shell_alias]
chctl = "clickhousectl"

[tasks.test]
description = "Run tests"
run = "cargo test"

[tasks.lint]
description = "Run hk lints"
run = "hk check --all"

[tasks.ci]
description = "Run CI related tasks"
depends = ["lint", "test"]
run = "echo 'CI completed successfully'"
