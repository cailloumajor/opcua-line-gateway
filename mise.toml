[tools]  # tombi: format.rules.table-keys-order = "ascending"
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
"aqua:quarylabs/sqruff" = "latest"
"aqua:taiki-e/cargo-llvm-cov" = "latest"
betterleaks = "latest"
clickhouse = "26.10"
cocogitto = "latest"
editorconfig-checker = "latest"
"github:JFRyy/systemd-lsp" = "latest"
"github:docker/docker-language-server" = "latest"
"github:mhersson/mpls" = "latest"
hadolint = "latest"
hk = "latest"
jactionlint = "latest"
marksman = "latest"
node = "lts"
"npm:bash-language-server" = "latest"
"npm:yaml-language-server" = "latest"
pkl = "latest"
rumdl = "latest"
rust = { version = "1.100.0", components = "rust-analyzer", profile = "default" }
shellcheck = "latest"
shfmt = "latest"
tombi = "latest"
typos = "latest"
usage = "latest"
uv = "latest"

[daemons.clickhouse-dev]
init = [
  'export CLICKHOUSE_CONFIG="$PWD/clickhouse/server.xml"',
  "mkdir -p .clickhouse/dev",
  "cd .clickhouse/dev",
]
port = { expect = [8123, 9000], bump = true }
run = 'exec clickhouse server --config-file="$CLICKHOUSE_CONFIG"'
ready_cmd = "clickhouse client --host 127.0.0.1 --port \"$PORT1\" --query 'SELECT 1'"

[daemons.clickhouse-integration]
init = [
  'export CLICKHOUSE_CONFIG="$PWD/clickhouse/server.xml"',
  "mkdir -p .clickhouse/integration",
  "cd .clickhouse/integration",
]
port = { expect = [8123, 9000], bump = true }
run = 'exec clickhouse server --config-file="$CLICKHOUSE_CONFIG"'
ready_cmd = "clickhouse client --host 127.0.0.1 --port \"$PORT1\" --query 'SELECT 1'"

[shell_alias]
# podman compose for package tests
pcpt = 'podman compose --project-directory {{ [config_root, "tests/package"] | join_path | quote }}'

[tasks.build-test-deb]
description = "Build Debian package for tests"
run = """
cargo deb \
  --profile deb-test \
  --no-separate-debug-symbols \
  --fast \
  --verbose \
  --output target/debian-tests/testpkg.deb
"""

[tasks.build-test-deb.tools]
"cargo:cargo-deb" = "latest"

[tasks."test:nextest-ci"]
description = "Run tests with cargo-nextest and generate code coverage"
daemons = "clickhouse-integration"
run = """
set -e
status=$(mise daemons status clickhouse-integration --json)
ports=$(node -e '
  const { status, port } = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
  if (status !== "running" || !Array.isArray(port) || port.length !== 2 ||
      !port.every(value => Number.isInteger(value) && value > 0 && value <= 65535)) {
    console.error("The ClickHouse integration daemon must be running with HTTP and TCP ports");
    process.exit(1);
  }
  console.log(port.join(" "));
' <<EOF
$status
EOF
)
read -r CLICKHOUSE_TEST_HTTP_PORT CLICKHOUSE_TEST_TCP_PORT <<EOF
$ports
EOF
export CLICKHOUSE_TEST_HTTP_PORT CLICKHOUSE_TEST_TCP_PORT
exec cargo llvm-cov nextest --profile ci --run-ignored all --workspace --lcov --output-path lcov.info
"""

# llvm-cov doesn't run doc tests, so run them separately
[tasks."test:doc"]
description = "Run documentation tests"
run = "cargo test --workspace --doc"

[tasks.lint]
description = "Run hk lints"
run = "hk check --all"

[tasks.ci]
description = "Run CI related tasks"
depends = ["lint", "test:*"]
run = "echo 'CI completed successfully'"

[settings]
experimental = true
