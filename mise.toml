[tools]  # tombi: format.rules.table-keys-order = "ascending"
actionlint = "latest"
"aqua:jdx/hk" = "latest"
"aqua:jdx/usage" = "latest"
betterleaks = "latest"
editorconfig-checker = "latest"
ghalint = "latest"
"github:ClickHouse/clickhousectl" = "latest"
"github:JFRyy/systemd-lsp" = "latest"
"github:mhersson/mpls" = "latest"
marksman = "latest"
node = "lts"
"npm:bash-language-server" = "latest"
"npm:yaml-language-server" = "latest"
pinact = "latest"
pkl = "latest"
rumdl = "latest"
rust = { version = "1.98.0", components = "rust-analyzer", profile = "default" }
shellcheck = "latest"
shfmt = "latest"
tombi = "latest"
typos = "latest"
zizmor = "latest"

[tools."cargo:https://github.com/ClickHouse/clickhouse-analyzer"]
version = "latest"
crate = "clickhouse-analyzer"
bin = "clickhouse-lsp"
features = "lsp"

[hooks]
enter = "mise outdated --local --silent"

[shell_alias]
chctl = "clickhousectl"

[tasks.build]
description = "Build the workspace"
run = "cargo build --workspace"

[tasks."test:unit"]
description = "Run unit tests and generate code coverage"
depends = ["build"]
run = "cargo llvm-cov --workspace --lcov --output-path lcov.info"

[tasks."test:unit".tools]
"aqua:taiki-e/cargo-llvm-cov" = "latest"

# llvm-cov doesn't run doc tests, so run them separately
[tasks."test:doc"]
description = "Run documentation tests"
depends = ["build"]
run = "cargo test --workspace --doc"

[tasks.lint]
description = "Run hk lints"
run = "hk check --all"

[tasks.ci]
description = "Run CI related tasks"
depends = ["lint", "test:*"]
run = "echo 'CI completed successfully'"
