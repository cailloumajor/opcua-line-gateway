[package]
name = "opcua-line-gateway"
version.workspace = true
edition.workspace = true
description = "OPC-UA gateway for production line"
publish.workspace = true

[package.metadata.deb]
maintainer = "Not Relevant <mail@example.com>"
depends = "$auto, procps"
recommends = "logrotate"
extended-description = """
Gateway for machines of an industrial production line, using OPC-UA to connect \
to PLCs, with data caching and archiving.
"""
revision = ""
assets = [
  "$auto",
  ["debian/opcua-line-gateway.logrotate", "etc/logrotate.d/opcua-line-gateway", "644"],
  ["debian/config.toml", "usr/share/doc/opcua-line-gateway/examples/", "644"],
  ["debian/credentials.toml", "usr/share/doc/opcua-line-gateway/examples/", "644"],
  ["schema/config.schema.json", "usr/share/doc/opcua-line-gateway/config.schema.json", "644"],
]
maintainer-scripts = "debian/"
separate-debug-symbols = true
compress-debug-symbols = true
profile = "deb"

[package.metadata.deb.systemd-units]

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.4.11"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1.0.103"
async-opcua = "0.19.0"
jiff = "0.2.34"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"

[dependencies]
anyhow.workspace = true
async-opcua = { workspace = true, features = ["client"] }
clickhouse = { version = "0.15.2", features = ["opentelemetry", "rustls-tls-native-roots"] }
futures-util = "0.3.32"
jiff.workspace = true
opcua-line-gateway-config = { path = "crates/config" }
parking_lot = "0.13.0"
redb = { version = "4.2.0", features = ["logging"] }
regex = "1.13.1"
reopen = "1.0.3"
serde.workspace = true
serde_json.workspace = true
signal-hook = { version = "0.4.4", default-features = false }
signal-hook-tokio = { version = "0.4.0", features = ["futures-v0_3"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror.workspace = true
tick = "0.8.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tracing-appender = { version = "0.2.5", features = ["parking_lot"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "parking_lot"] }

[dev-dependencies]
async-opcua = { workspace = true, features = ["server"] }
duct = "1.1.2"
indoc = "2.0.8"
rand = "0.10.3"
serde_test = "1.0.177"
tempfile = "3.27.0"
tick = { version = "0.8.0", features = ["test-util"] }
tokio = { version = "1.52.3", features = ["net"] }

[profile.deb]
inherits = "release"
debug = "line-tables-only"
lto = true

# Faster build of the package under test, its behavior is not affected.
[profile.deb-test]
inherits = "release"
debug = false
lto = false
incremental = true
