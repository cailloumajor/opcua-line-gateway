[[language]]
name = "sql"
language-servers = ["clickhouse-lsp"]

[[language]]
name = "markdown"
auto-format = true
language-servers = ["marksman", "rumdl", "mpls"]
formatter = { command = "rumdl", args = ["check", "--fix", "--stdin"] }

[[language]]
name = "pkl"
auto-format = true

[language-server.clickhouse-lsp]
command = "clickhouse-lsp"

[language-server.mpls]
command = "mpls"
args = ["--theme", "dark", "--enable-emoji", "--full-sync"]

[language-server.rumdl]
command = "rumdl"
args = ["server"]

[language-server.rust-analyzer.config]
check.command = "clippy"
imports.granularity.enforce = true
imports.granularity.group = "module"
imports.prefix = "self"
