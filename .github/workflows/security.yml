name: Security audit

on:
  push:
    branches:
      - main
      - "renovate/*"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pre_job:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          paths: '["**/Cargo.toml", "**/Cargo.lock", ".github/workflows/security.yml"]'
          concurrent_skipping: same_content
          do_not_skip: '["release", "workflow_dispatch", "schedule"]'
          skip_after_successful_duplicate: true

  security_audit:
    permissions:
      contents: read
      issues: write
      checks: write
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: false
      - name: Ensure Rust toolchain and components are installed
        run: mise install --force rust
      - name: Add a job summary
        run: mise exec aqua:rustsec/rustsec/cargo-audit -c "cargo audit >>$GITHUB_STEP_SUMMARY 2>&1 || true"
      - run: mise exec aqua:rustsec/rustsec/cargo-audit -c "cargo audit --format sarif >cargo-audit.sarif"
      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        if: always()
        with:
          sarif_file: cargo-audit.sarif
