name: Publish Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  publish_release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: false
          install: false
      - name: Ensure Rust toolchain and components are installed
        run: mise install --force rust
      - name: Build Debian package
        run: mise exec cargo:cargo-deb@latest -- cargo deb --verbose
      - name: Upload Debian package to release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ github.ref_name }}
        run: |
          gh release upload "$tag" target/debian/*.deb schema/*
          gh release edit "$tag" --draft=false
