name: Publish Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  publish_release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          install: false
      - name: Ensure Rust toolchain and components are installed
        run: mise install --force rust
      - name: Build Debian package
        id: build_deb_pkg
        run: mise run build-release-deb
      - name: Upload Debian package to release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ github.ref_name }}
        run: |
          gh release upload "$tag" "${{ steps.build_deb_pkg.outputs.path }}"
          gh release edit "$tag" --draft=false
