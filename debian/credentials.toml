# Credentials of the OPC-UA line gateway, kept out of the configuration file.
#
# Every value below is an example, to be adapted. Install this file in the
# systemd credential store, only accessible by root, which loads it for the
# service:
#
#   sudo install -m 0600 credentials.toml /etc/credstore/opcua-line-gateway.toml
#
# The service reads credentials when starting, so restart it after any change.

# ClickHouse database credential, required.
[database]
user = "line_gateway"
password = "change-me"

# OPC-UA servers credentials, keyed by machine identifier as in the
# configuration file. Machines without an entry use anonymous authentication.
[opc_ua.PLC1]
user = "line_gateway"
password = "change-me"
